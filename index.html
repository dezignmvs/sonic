<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101110"><meta name="description" content="Sonic — music, in your own rhythm.">
  <title>Sonic — Music, in your own rhythm</title><link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg"><link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://use.hugeicons.com" crossorigin>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#home" aria-label="Sonic home"><span class="brand-mark"><svg viewBox="0 0 32 32"><path d="M4 16h4l3-9 5 18 4-13 3 8h5"/></svg></span><span>Sonic</span></a>
      <nav class="primary-nav">
        <a class="nav-link active" href="#home" data-page="home"><span class="icon" data-icon="home"></span>Home</a>
        <a class="nav-link" href="#search" data-page="search"><span class="icon" data-icon="search"></span>Search</a>
        <a class="nav-link" href="#explore" data-page="explore"><span class="icon" data-icon="compass"></span>Explore</a>
        <a class="nav-link" href="#library" data-page="library"><span class="icon" data-icon="library"></span>Your library</a>
      </nav>
      <div class="sidebar-label-row"><span class="eyebrow">YOUR COLLECTION</span><button class="icon-button small" id="create-playlist" aria-label="Create playlist" title="Create playlist"><span class="icon" data-icon="plus"></span></button></div>
      <nav class="collection-nav">
        <a class="nav-link" href="#liked" data-page="liked"><span class="icon liked-icon" data-icon="heart"></span>Liked songs</a>
        <a class="nav-link" href="#recent" data-page="recent"><span class="icon" data-icon="clock"></span>Recently played</a>
        <a class="nav-link" href="#local" data-page="local"><span class="icon" data-icon="device"></span>Local music</a>
        <a class="nav-link" href="#upload" data-page="upload"><span class="icon" data-icon="upload"></span>Upload music</a>
      </nav>
      <div class="playlist-list" id="playlist-nav"></div>
      <div class="sidebar-bottom"><div class="connection-status"><span class="status-dot"></span><span id="provider-status">Connecting to music</span></div><button class="nav-link settings-link" data-page="settings"><span class="icon" data-icon="settings"></span>Settings</button></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><a class="mobile-brand" href="#home" aria-label="Sonic home"><span class="brand-mark"><svg viewBox="0 0 32 32"><path d="M4 16h4l3-9 5 18 4-13 3 8h5"/></svg></span><span>Sonic</span></a><div class="history-controls"><button class="icon-button" id="nav-back" aria-label="Go back"><span class="icon" data-icon="back"></span></button><button class="icon-button" id="nav-forward" aria-label="Go forward"><span class="icon" data-icon="forward"></span></button></div><div class="topbar-actions"><button class="icon-button" id="install-app" aria-label="Install app" title="Install Sonic"><span class="icon" data-icon="download"></span></button><div class="profile-menu-wrap"><button class="avatar" id="profile-button" aria-label="Open profile menu" aria-expanded="false"><span class="profile-initial" id="profile-initial">G</span></button><div class="profile-menu" id="profile-menu" aria-hidden="true"><div class="profile-menu-name" id="profile-menu-name">Guest</div><button type="button" id="profile-edit-action"><span class="icon"><i class="hgi hgi-stroke hgi-rounded hgi-edit-02" aria-hidden="true"></i></span>Edit profile</button><button type="button" id="profile-lock-action"><span class="icon" data-icon="lock"></span><span id="profile-lock-label">Lock</span></button><button type="button" id="profile-download-action"><span class="icon" data-icon="download"></span>Download</button></div></div></div></header>
      <div id="view" class="view" tabindex="-1"></div>
    </main>
    <aside class="now-panel" id="now-panel" aria-label="Now playing and queue"><div class="panel-heading"><span>Now playing</span><button class="icon-button small" id="close-panel" aria-label="Close panel"><span class="icon" data-icon="close"></span></button></div><div id="now-panel-content"></div><div class="queue-heading"><span>Up next</span><button class="text-button" id="clear-queue">Clear</button></div><div id="queue-list" class="queue-list"></div></aside>
  </div>
  <div class="mini-player" id="mini-player"><div class="mini-track" id="mini-track"><div class="artwork artwork-placeholder mini-art" id="mini-art"></div><div class="track-copy"><strong id="mini-title">Choose something to play</strong><span id="mini-artist">Your music, your way</span></div><button class="icon-button like-button" id="mini-like" aria-label="Like track"><span class="icon" data-icon="heart"></span></button><button class="icon-button mini-add-playlist" id="mini-add-playlist" aria-label="Add to playlist" title="Add to playlist"><i class="hgi hgi-stroke hgi-rounded hgi-add-circle-half-dot" aria-hidden="true"></i><svg class="playlist-add-fallback" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/><circle class="playlist-add-dot" cx="18.5" cy="5.5" r="1"/></svg></button></div><div class="transport"><div class="transport-buttons"><button class="icon-button" id="shuffle-button" aria-label="Shuffle"><span class="icon" data-icon="shuffle"></span></button><button class="icon-button" id="previous-button" aria-label="Previous track"><span class="icon" data-icon="previous"></span></button><button class="play-button" id="play-button" aria-label="Play"><span class="icon" data-icon="play"></span></button><button class="icon-button" id="next-button" aria-label="Next track"><span class="icon" data-icon="next"></span></button><button class="icon-button" id="repeat-button" aria-label="Repeat off"><span class="icon" data-icon="repeat"></span></button></div><div class="timeline"><span id="current-time">0:00</span><input id="seek" aria-label="Seek" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div></div><div class="player-extras"><button class="icon-button queue-toggle" id="queue-toggle" aria-label="Toggle queue"><span class="icon" data-icon="queue"></span></button><button class="icon-button" id="volume-toggle" aria-label="Mute"><span class="icon" data-icon="volume"></span></button><input id="volume" type="range" min="0" max="1" step="0.01" value="0.78" aria-label="Volume"><button class="icon-button expand-player" id="expand-player" aria-label="Expand player"><span class="icon" data-icon="expand"></span></button></div><div class="mobile-progress" id="mobile-progress"></div></div>
  <section class="track-popover" id="track-popover" aria-label="Now playing details" aria-hidden="true"></section>
  <nav class="mobile-nav" aria-label="Mobile navigation"><a href="#home" data-page="home" class="active"><span class="icon" data-icon="home"></span><small>Home</small></a><a href="#search" data-page="search"><span class="icon" data-icon="search"></span><small>Search</small></a><a href="#explore" data-page="explore"><span class="icon" data-icon="compass"></span><small>Explore</small></a><a href="#library" data-page="library"><span class="icon" data-icon="library"></span><small>Library</small></a></nav>
  <audio id="audio" preload="metadata"></audio><div id="toast-region" class="toast-region" aria-live="polite"></div><div id="update-banner" class="update-banner" hidden><span>A new Sonic update is ready.</span><button id="update-now" class="primary-button">Update</button></div><div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body></html>
